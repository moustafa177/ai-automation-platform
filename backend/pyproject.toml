[tool.poetry]
name = "ai-platform-backend"
version = "0.1.0"
description = "منصة حلول الذكاء الاصطناعي والأتمتة للشركات"
authors = ["Mustafa <mustafa@platform.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

# ── FastAPI & Web ─────────────────────────────────────────
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = "^0.0.12"
websockets = "^13.0"
httpx = "^0.27.0"

# ── Database ─────────────────────────────────────────────
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
redis = {extras = ["hiredis"], version = "^5.2.0"}

# ── Auth & Security ───────────────────────────────────────
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
cryptography = "^43.0.0"

# ── AI & ML ───────────────────────────────────────────────
anthropic = "^0.40.0"
langchain = "^0.3.0"
langchain-anthropic = "^0.3.0"
chromadb = "^0.5.0"
sentence-transformers = "^3.0.0"

# ── Automation ────────────────────────────────────────────
celery = {extras = ["redis"], version = "^5.4.0"}

# ── Data & Analytics ─────────────────────────────────────
pandas = "^2.2.0"
numpy = "^2.0.0"
influxdb-client = {extras = ["async"], version = "^1.47.0"}

# ── File Storage ─────────────────────────────────────────
minio = "^7.2.0"
python-magic = "^0.4.27"
pypdf = "^5.0.0"

# ── Network Monitoring ───────────────────────────────────
pysnmp = "^7.1.0"
netmiko = "^4.4.0"
prometheus-client = "^0.21.0"

# ── Utilities ────────────────────────────────────────────
pydantic-settings = "^2.6.0"
pydantic = {extras = ["email"], version = "^2.10.0"}
python-dotenv = "^1.0.0"
tenacity = "^9.0.0"
structlog = "^24.4.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.18.0"}
emails = "^0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
faker = "^30.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
